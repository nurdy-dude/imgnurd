<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>imgnurd Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; }
    .nav-tabs .nav-link { color: #94a3b8; border: none; }
    .nav-tabs .nav-link.active { background-color: #1e293b; color: #38bdf8; border-bottom: 2px solid #38bdf8; }
    .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #f8fafc; }
    .form-control:focus, .form-select:focus { background-color: #0f172a; color: #f8fafc; border-color: #38bdf8; box-shadow: none; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">🤓 imgnurd</h1>
      <button id="checkNowBtn" onclick="runCheckNow()" class="btn btn-primary">
        🔍 Check Now
      </button>
    </div>

    <ul class="nav nav-tabs mb-4" id="mainTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="containers-tab" data-bs-toggle="tab" data-bs-target="#containers-panel" type="button">Containers</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings-panel" type="button">Settings & Webhooks</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
      <!-- Containers List Tab -->
      <div class="tab-pane fade show active" id="containers-panel" role="tabpanel">
        <div id="containerGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-info" role="status"></div>
            <p class="mt-2 text-muted">Loading containers...</p>
          </div>
        </div>
      </div>

      <!-- Settings Tab -->
      <div class="tab-pane fade" id="settings-panel" role="tabpanel">
        <div class="card p-4 max-w-lg">
          <h4 class="mb-3">Schedule & Webhook Notifications</h4>
          <form id="settingsForm" onsubmit="saveSettings(event)">
            <div class="mb-3">
              <label class="form-label">Cron Schedule (Standard Cron Syntax)</label>
              <input type="text" id="cronSchedule" class="form-control" placeholder="0 */6 * * *">
              <div class="form-text text-muted">Default is <code>0 */6 * * *</code> (every 6 hours).</div>
            </div>

            <hr class="my-4 border-secondary">
            <h5 class="mb-3">Webhooks</h5>

            <div class="mb-3">
              <label class="form-label">Discord Webhook URL</label>
              <input type="url" id="discordWebhook" class="form-control" placeholder="https://discord.com/api/webhooks/...">
            </div>

            <div class="mb-3">
              <label class="form-label">Slack Webhook URL</label>
              <input type="url" id="slackWebhook" class="form-control" placeholder="https://hooks.slack.com/services/...">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Gotify Server URL</label>
                <input type="url" id="gotifyUrl" class="form-control" placeholder="https://gotify.example.com">
              </div>
              <div class="col-md-6">
                <label class="form-label">Gotify Token</label>
                <input type="text" id="gotifyToken" class="form-control">
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Telegram Bot Token</label>
                <input type="text" id="telegramToken" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Telegram Chat ID</label>
                <input type="text" id="telegramChatId" class="form-control">
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
              <button type="button" onclick="testNotification()" class="btn btn-outline-info">🧪 Send Test Notification</button>
              <button type="submit" class="btn btn-success">Save Settings</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadContainers() {
      try {
        const res = await fetch('/api/containers');
        const containers = await res.json();
        const grid = document.getElementById('containerGrid');

        if (containers.length === 0) {
          grid.innerHTML = `<div class="col-12"><div class="alert alert-info">No running containers detected.</div></div>`;
          return;
        }

        grid.innerHTML = containers.map(c => {
          const badgeHtml = c.updateAvailable
            ? `<span class="badge bg-warning text-dark">⚠️ Update Available</span>`
            : `<span class="badge bg-success">✅ Up to Date</span>`;

          return `
            <div class="col">
              <div class="card h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                  <div>
                    <div class="d-flex justify-content-between align-items-start mb-2">
                      <h5 class="card-title h6 mb-0 text-truncate" title="${c.name}">${c.name}</h5>
                      ${badgeHtml}
                    </div>
                    <p class="card-text text-muted small text-break mb-2">${c.image}</p>
                  </div>
                  <div class="mt-3 pt-2 border-top border-secondary d-flex justify-content-between align-items-center">
                    <small class="text-secondary" style="font-size: 0.75rem;">Checked: ${c.lastChecked}</small>
                    ${c.updateAvailable 
                      ? `<button onclick="updateContainer('${c.id}')" class="btn btn-sm btn-outline-warning">Update</button>` 
                      : `<button disabled class="btn btn-sm btn-outline-secondary opacity-50">Current</button>`}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to fetch containers:', err);
      }
    }

    async function runCheckNow() {
      const btn = document.getElementById('checkNowBtn');
      btn.disabled = true;
      btn.innerText = '⏳ Checking...';

      try {
        const res = await fetch('/api/containers/check-now', { method: 'POST' });
        const data = await res.json();
        alert(data.message);
        await loadContainers();
      } catch (err) {
        alert('Error running update check.');
      } finally {
        btn.disabled = false;
        btn.innerText = '🔍 Check Now';
      }
    }

    async function updateContainer(id) {
      if (!confirm('Are you sure you want to pull the latest image and restart this container?')) return;
      try {
        const res = await fetch(`/api/containers/${id}/update`, { method: 'POST' });
        const data = await res.json();
        alert(data.message);
        loadContainers();
      } catch (err) {
        alert('Failed to trigger update.');
      }
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const cfg = await res.json();
        document.getElementById('cronSchedule').value = cfg.cronSchedule || '0 */6 * * *';
        document.getElementById('discordWebhook').value = cfg.discordWebhook || '';
        document.getElementById('slackWebhook').value = cfg.slackWebhook || '';
        document.getElementById('gotifyUrl').value = cfg.gotifyUrl || '';
        document.getElementById('gotifyToken').value = cfg.gotifyToken || '';
        document.getElementById('telegramToken').value = cfg.telegramToken || '';
        document.getElementById('telegramChatId').value = cfg.telegramChatId || '';
      } catch (err) {
        console.error('Failed to load settings:', err);
      }
    }

    async function saveSettings(e) {
      e.preventDefault();
      const payload = {
        cronSchedule: document.getElementById('cronSchedule').value,
        discordWebhook: document.getElementById('discordWebhook').value,
        slackWebhook: document.getElementById('slackWebhook').value,
        gotifyUrl: document.getElementById('gotifyUrl').value,
        gotifyToken: document.getElementById('gotifyToken').value,
        telegramToken: document.getElementById('telegramToken').value,
        telegramChatId: document.getElementById('telegramChatId').value,
      };

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) alert('Settings saved successfully!');
      } catch (err) {
        alert('Failed to save settings.');
      }
    }

    async function testNotification() {
      try {
        const res = await fetch('/api/settings/test-notification', { method: 'POST' });
        const data = await res.json();
        alert(data.message || data.error);
      } catch (err) {
        alert('Failed to send test notification.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadContainers();
      loadSettings();
    });
  </script>
</body>
</html>
